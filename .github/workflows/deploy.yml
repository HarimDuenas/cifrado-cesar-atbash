# Publica el sitio en GitHub Pages. Corre en cada push a `main`, y como `main`
# solo recibe codigo por merge de un Pull Request, en practica publica al mergear.
name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  # Permite lanzarlo a mano desde la pestaña Actions.
  workflow_dispatch:

# Minimo privilegio: de entrada, solo lectura. Los permisos de escritura se
# declaran abajo, en el unico job que los necesita.
# (OpenSSF Scorecard, chequeo Token-Permissions.)
permissions:
  contents: read

# Un solo despliegue a la vez.
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write # publicar el sitio
      id-token: write # OIDC: se autentica sin guardar ningun token en el repo

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # Todas las acciones van fijadas al hash del commit, no a una etiqueta
      # movil como @v7: una etiqueta se puede reapuntar a otro codigo.
      # (OpenSSF Scorecard, chequeo Pinned-Dependencies.)
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Si los tests fallan, no se publica. El sitio en linea siempre
      # corresponde a un commit con la suite verde.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
